<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
  <!-- 圆角底板 -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bg)"/>
  <!-- 代码括号 </>：描边绘制，无字体依赖 -->
  <g fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M54 44 L34 64 L54 84"/>
    <path d="M74 44 L94 64 L74 84"/>
    <line x1="70" y1="92" x2="58" y2="36"/>
  </g>
  <!-- 右下角净化徽标：绿底白勾，表示注释已净化 -->
  <circle cx="95" cy="93" r="17" fill="#22C55E" stroke="#1D4ED8" stroke-width="5"/>
  <path d="M87 93 L93 99 L103 87" fill="none" stroke="#FFFFFF" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
